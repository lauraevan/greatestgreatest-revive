name: Stabilize direct game launches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-game-launches.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore direct new-tab launches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # The static per-game iframe launchers caused compatibility problems.
          text = text.replace('\n<script src="launch-map.js"></script>', '')
          text = text.replace('<script src="launch-map.js"></script>\n', '')

          func_re = re.compile(
              r'function newTabGameUrl\(path, title = ""\) \{.*?\n\}',
              re.S,
          )
          replacement = '''function newTabGameUrl(path, title = "") {
              // Open the real game page directly. Each local game page already
              // carries its own Apple Home Screen icon metadata.
              return path;
          }'''
          text, n = func_re.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not replace newTabGameUrl')

          # Keep the simplified player controls: no Fullscreen or New Tab buttons.
          text = re.sub(r'\s*<button onclick="fullscreenGame\(\)">.*?</button>', '', text, count=1)
          text = re.sub(r'\s*<button onclick="openGameTab\(\)">.*?</button>', '', text, count=1)

          p.write_text(text, encoding='utf-8')

          # Remove the generated wrapper layer entirely so stale launcher URLs
          # cannot keep interfering with games.
          import shutil
          shutil.rmtree('launchers', ignore_errors=True)
          shutil.rmtree('launch-icons', ignore_errors=True)
          Path('launch-map.js').unlink(missing_ok=True)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/stabilize-game-launches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix buggy new-tab game launching"
          git push
