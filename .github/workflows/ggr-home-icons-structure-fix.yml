name: GGR Home Screen metadata structure fix

on:
  push:
    paths:
      - '.github/workflows/ggr-home-icons-structure-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Place Home Screen metadata in the real document head
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib, html, json, re

          REPO = 'lauraevan/greatestgreatest-revive'
          BRANCH = 'main'
          RAW_BASE = f'https://raw.githack.com/{REPO}/{BRANCH}/'
          root = Path('.')

          mapping = {}
          row_re = re.compile(
              r'^\s*\[\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"',
              re.M,
          )
          p = root / 'games-data.js'
          if p.exists():
              data = p.read_text(encoding='utf-8', errors='replace')
              for m in row_re.finditer(data):
                  try:
                      source, launch, icon_path, title = [json.loads('"' + x + '"') for x in m.groups()]
                  except Exception:
                      continue
                  clean = launch.split('#',1)[0].split('?',1)[0].lstrip('./')
                  if not re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', clean):
                      mapping[clean] = (title, icon_path.lstrip('./'))

          targets = set(root.glob('library/**/*.html'))
          for launch in mapping:
              fp = root / launch
              if fp.exists() and fp.is_file() and fp.suffix.lower() in ('.html','.htm'):
                  targets.add(fp)

          marker_re = re.compile(r'\s*<!-- GGR_HOME_ICON_START -->.*?<!-- GGR_HOME_ICON_END -->\s*', re.I|re.S)
          link_re = re.compile(r'<link\b[^>]*>', re.I|re.S)
          meta_re = re.compile(r'<meta\b[^>]*>', re.I|re.S)
          attr_tpl = r'\b%s\s*=\s*(["\'])(.*?)\1'

          def attr(tag, name):
              m = re.search(attr_tpl % re.escape(name), tag, re.I|re.S)
              return html.unescape(m.group(2).strip()) if m else ''

          def existing_icon_url(text, page_rel):
              base_m = re.search(r'<base\b[^>]*\bhref\s*=\s*(["\'])(.*?)\1', text[:20000], re.I|re.S)
              base = html.unescape(base_m.group(2).strip()) if base_m else ''
              for tag in link_re.findall(text[:40000]):
                  rel = attr(tag,'rel').lower().split()
                  href = attr(tag,'href')
                  if href and ('icon' in rel or 'shortcut' in rel) and not href.lower().startswith('data:'):
                      if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', href): return href
                      if href.startswith('//'): return 'https:' + href
                      if base and re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', base): return urljoin(base,href)
                      return urljoin(RAW_BASE + page_rel, href)
              return RAW_BASE + 'icons/app-192.png'

          def clean_conflicts(text):
              text = marker_re.sub('\n', text)
              def cl(m):
                  rel = attr(m.group(0),'rel').lower().split()
                  return '' if ('apple-touch-icon' in rel or 'apple-touch-icon-precomposed' in rel) else m.group(0)
              text = link_re.sub(cl,text)
              def cm(m):
                  name = attr(m.group(0),'name').lower()
                  if name in {'apple-mobile-web-app-title','apple-mobile-web-app-capable','apple-mobile-web-app-status-bar-style','mobile-web-app-capable'}:
                      return ''
                  return m.group(0)
              return meta_re.sub(cm,text)

          def generated_png(page_rel):
              stem = re.sub(r'[^A-Za-z0-9._-]+','-',Path(page_rel).stem).strip('-') or 'game'
              digest = hashlib.sha1(page_rel.encode()).hexdigest()[:8]
              rel = f'home-icons/{stem}-{digest}.png'
              return rel if (root/rel).exists() else None

          patched = 0
          for page in sorted(targets):
              rel = page.as_posix()
              original = page.read_text(encoding='utf-8',errors='replace')
              entry = mapping.get(rel)
              if entry:
                  title, icon_src = entry
              else:
                  tm = re.search(r'<title\b[^>]*>(.*?)</title\s*>', original[:40000], re.I|re.S)
                  title = html.unescape(re.sub(r'<[^>]+>','',tm.group(1)).strip()) if tm else page.stem.replace('-',' ').replace('_',' ').title()
                  icon_src = ''

              png_rel = generated_png(rel)
              icon_url = RAW_BASE + png_rel if png_rel else existing_icon_url(original, rel)
              text = clean_conflicts(original)

              block = (
                  '<!-- GGR_HOME_ICON_START -->\n'
                  f'<link rel="apple-touch-icon" sizes="180x180" href="{html.escape(icon_url,quote=True)}">\n'
                  '<meta name="mobile-web-app-capable" content="yes">\n'
                  '<meta name="apple-mobile-web-app-capable" content="yes">\n'
                  f'<meta name="apple-mobile-web-app-title" content="{html.escape(title or page.stem,quote=True)}">\n'
                  '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
                  '<!-- GGR_HOME_ICON_END -->'
              )

              # Only trust structural tags before the first script/body. This avoids
              # HTML snippets embedded inside game JavaScript fooling the parser.
              probe = text[:50000]
              stops = [m.start() for pat in (r'<script\b',r'<body\b') if (m := re.search(pat,probe,re.I))]
              cutoff = min(stops) if stops else len(probe)
              prefix = probe[:cutoff]
              head = re.search(r'<head(?:\s[^>]*)?>', prefix, re.I|re.S)
              html_tag = re.search(r'<html(?:\s[^>]*)?>', prefix, re.I|re.S)

              if head:
                  pos = head.end()
                  text = text[:pos] + '\n' + block + '\n' + text[pos:]
              elif html_tag:
                  pos = html_tag.end()
                  text = text[:pos] + '\n<head>\n' + block + '\n</head>\n' + text[pos:]
              else:
                  text = '<head>\n' + block + '\n</head>\n' + text

              page.write_text(text,encoding='utf-8')
              patched += 1

          print(f'Placed canonical metadata at the top of {patched} game pages')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/ggr-home-icons-structure-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Place Home Screen metadata correctly on every game"
          git push
