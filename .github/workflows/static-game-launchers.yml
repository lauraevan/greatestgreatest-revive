name: Build static per-game launchers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-game-launchers.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install image support
        run: python -m pip install --quiet pillow

      - name: Generate static clean launchers for every catalog game
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import html, json, re, shutil, hashlib

          root = Path('.')
          launchers = root / 'launchers'
          launch_icons = root / 'launch-icons'
          shutil.rmtree(launchers, ignore_errors=True)
          shutil.rmtree(launch_icons, ignore_errors=True)
          launchers.mkdir(parents=True, exist_ok=True)
          launch_icons.mkdir(parents=True, exist_ok=True)

          row_re = re.compile(
              r'^\s*\[\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"',
              re.M,
          )

          rows = []
          for filename in ('games-data.js', 'games-noicon.js'):
              p = root / filename
              if not p.exists():
                  continue
              data = p.read_text(encoding='utf-8', errors='replace')
              for m in row_re.finditer(data):
                  try:
                      source, game_path, icon_path, title = [json.loads('"' + x + '"') for x in m.groups()]
                  except Exception:
                      continue
                  if not game_path:
                      continue
                  rows.append((game_path, icon_path, title or 'Game'))

          # Stable unique launcher name per URL/path. A path only needs one launcher.
          unique = {}
          for game_path, icon_path, title in rows:
              unique.setdefault(game_path, (icon_path, title))

          def key_for(value):
              return hashlib.sha1(value.encode('utf-8')).hexdigest()[:12]

          def stem_for(game_path):
              clean = game_path.split('#',1)[0].split('?',1)[0].rstrip('/')
              stem = Path(clean).stem if clean else 'game'
              stem = re.sub(r'[^A-Za-z0-9._-]+', '-', stem).strip('-') or 'game'
              return stem[:70]

          generic_candidates = [root/'icons/app-192.png', root/'apple-touch-icon.png']
          generic = next((p for p in generic_candidates if p.exists()), None)

          def make_png(icon_path, out_path):
              candidates = []
              if icon_path and not re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', icon_path):
                  candidates.append(root / icon_path.lstrip('./'))
              if generic:
                  candidates.append(generic)
              for src in candidates:
                  try:
                      if not src.exists() or not src.is_file():
                          continue
                      with Image.open(src) as im:
                          im = im.convert('RGBA')
                          im = ImageOps.fit(im, (180, 180), method=Image.Resampling.LANCZOS, centering=(0.5,0.5))
                          im.save(out_path, 'PNG', optimize=True)
                          return True
                  except Exception:
                      continue
              return False

          launch_map = {}
          generated = 0
          for game_path, (icon_path, title) in unique.items():
              digest = key_for(game_path)
              stem = stem_for(game_path)
              launcher_rel = f'launchers/{stem}-{digest}.html'
              icon_rel = f'launch-icons/{stem}-{digest}.png'
              icon_out = root / icon_rel
              made_icon = make_png(icon_path, icon_out)

              if made_icon:
                  touch_href = '../' + icon_rel
              elif generic:
                  touch_href = '../' + generic.as_posix()
              else:
                  touch_href = '../icons/app-192.png'

              if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', game_path) or game_path.startswith('//'):
                  target = game_path
              else:
                  target = '../' + game_path.lstrip('./')

              esc_title = html.escape(title, quote=True)
              esc_target = html.escape(target, quote=True)
              esc_icon = html.escape(touch_href, quote=True)

              page = f'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <title>{esc_title}</title>
          <link rel="apple-touch-icon" sizes="180x180" href="{esc_icon}">
          <link rel="icon" type="image/png" sizes="180x180" href="{esc_icon}">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="{esc_title}">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="theme-color" content="#000000">
          <style>
          html,body{{margin:0;width:100%;height:100%;overflow:hidden;background:#000}}
          #game{{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}}
          </style>
          </head>
          <body>
          <iframe id="game" src="{esc_target}" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe>
          </body>
          </html>
          '''
              (root / launcher_rel).write_text(page, encoding='utf-8')
              # Query version deliberately changes the installed URL from the old dynamic launcher.
              launch_map[game_path] = launcher_rel + '?v=static3'
              generated += 1

          map_js = 'window.GGR_LAUNCH_MAP = ' + json.dumps(launch_map, ensure_ascii=False, separators=(',', ':')) + ';\n'
          (root / 'launch-map.js').write_text(map_js, encoding='utf-8')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8', errors='replace')

          # Load the generated mapping beside the catalog data.
          if '<script src="launch-map.js"></script>' not in text:
              needle = '<script src="games-noicon.js"></script>'
              if needle in text:
                  text = text.replace(needle, needle + '\n<script src="launch-map.js"></script>', 1)
              else:
                  text = text.replace('</body>', '<script src="launch-map.js"></script>\n</body>', 1)

          # Static per-game pages put apple-touch-icon in the initial HTML, which iOS reliably reads.
          func_re = re.compile(
              r'function newTabGameUrl\(path, title = ""\) \{.*?return "launch\.html\?" \+ params\.toString\(\);\n\}',
              re.S,
          )
          replacement = '''function newTabGameUrl(path, title = "") {
              if (window.GGR_LAUNCH_MAP && window.GGR_LAUNCH_MAP[path]) {
                  return window.GGR_LAUNCH_MAP[path];
              }
              var rows = (typeof catalog !== "undefined" && Array.isArray(catalog))
                  ? catalog
                  : (Array.isArray(window.GAME_DATA) ? window.GAME_DATA : []);
              var row = rows.find(function (g) { return g && g[1] === path; })
                  || rows.find(function (g) { return g && g[3] === title; });
              var icon = (row && row[2]) ? row[2] : "icons/app-192.png";
              var params = new URLSearchParams();
              params.set("game", path);
              params.set("title", title || "Game");
              params.set("icon", icon);
              return "launch.html?" + params.toString();
          }'''
          text, n = func_re.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('Could not patch newTabGameUrl')

          # Remove the extra player-bar controls the user does not want.
          text = re.sub(r'\s*<button onclick="fullscreenGame\(\)">.*?</button>', '', text, count=1)
          text = re.sub(r'\s*<button onclick="openGameTab\(\)">.*?</button>', '', text, count=1)

          index.write_text(text, encoding='utf-8')
          print(f'Generated {generated} static launcher pages')
          print(f'Launch map entries: {len(launch_map)}')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/static-game-launchers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use clean static launchers with reliable game icons"
          git push
