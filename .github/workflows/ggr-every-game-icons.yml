name: GGR every game Home Screen icons

on:
  push:
    paths:
      - '.github/workflows/ggr-every-game-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image support
        run: python -m pip install --quiet pillow

      - name: Patch every local game page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from urllib.parse import urljoin
          import html, json, re, hashlib

          REPO = 'lauraevan/greatestgreatest-revive'
          BRANCH = 'main'
          RAW_BASE = f'https://raw.githack.com/{REPO}/{BRANCH}/'
          root = Path('.')
          out_dir = root / 'home-icons'
          out_dir.mkdir(exist_ok=True)

          # Read all catalog rows that provide an actual game icon.
          mapping = {}
          row_re = re.compile(
              r'^\s*\[\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"\s*,\s*"((?:\\.|[^"\\])*)"',
              re.M,
          )
          for catalog_name in ('games-data.js',):
              p = root / catalog_name
              if not p.exists():
                  continue
              data = p.read_text(encoding='utf-8', errors='replace')
              for m in row_re.finditer(data):
                  try:
                      source, launch, icon_path, title = [json.loads('"' + x + '"') for x in m.groups()]
                  except Exception:
                      continue
                  clean_launch = launch.split('#', 1)[0].split('?', 1)[0].lstrip('./')
                  if not re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', clean_launch):
                      mapping[clean_launch] = (title, icon_path.lstrip('./'))

          # Every HTML file under library gets fixed, even if it isn't in the artwork catalog.
          targets = set(root.glob('library/**/*.html'))
          # Also cover any other local HTML game path explicitly present in the catalog.
          for launch in mapping:
              p = root / launch
              if p.exists() and p.is_file() and p.suffix.lower() in ('.html', '.htm'):
                  targets.add(p)

          marker_re = re.compile(r'\s*<!-- GGR_HOME_ICON_START -->.*?<!-- GGR_HOME_ICON_END -->\s*', re.I | re.S)
          tag_link_re = re.compile(r'<link\b[^>]*>', re.I | re.S)
          tag_meta_re = re.compile(r'<meta\b[^>]*>', re.I | re.S)
          attr_re_tpl = r'\b%s\s*=\s*(["\'])(.*?)\1'

          def attr(tag, name):
              m = re.search(attr_re_tpl % re.escape(name), tag, re.I | re.S)
              return html.unescape(m.group(2).strip()) if m else ''

          def existing_icon_url(text, page_rel):
              base_match = re.search(r'<base\b[^>]*\bhref\s*=\s*(["\'])(.*?)\1', text, re.I | re.S)
              base = html.unescape(base_match.group(2).strip()) if base_match else ''
              for tag in tag_link_re.findall(text):
                  rel = attr(tag, 'rel').lower().split()
                  href = attr(tag, 'href')
                  if href and ('icon' in rel or 'shortcut' in rel) and not href.lower().startswith('data:'):
                      if re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', href):
                          return href
                      if href.startswith('//'):
                          return 'https:' + href
                      if base and re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*://', base):
                          return urljoin(base, href)
                      return urljoin(RAW_BASE + page_rel, href)
              return RAW_BASE + 'icons/app-192.png'

          def clean_conflicts(text):
              text = marker_re.sub('\n', text)
              def clean_link(m):
                  tag = m.group(0)
                  rel = attr(tag, 'rel').lower().split()
                  return '' if 'apple-touch-icon' in rel or 'apple-touch-icon-precomposed' in rel else tag
              text = tag_link_re.sub(clean_link, text)
              def clean_meta(m):
                  tag = m.group(0)
                  name = attr(tag, 'name').lower()
                  if name in {
                      'apple-mobile-web-app-title',
                      'apple-mobile-web-app-capable',
                      'apple-mobile-web-app-status-bar-style',
                      'mobile-web-app-capable',
                  }:
                      return ''
                  return tag
              return tag_meta_re.sub(clean_meta, text)

          def make_png(icon_rel, page_rel):
              src = root / icon_rel
              if not src.exists() or not src.is_file():
                  return None
              safe_stem = re.sub(r'[^A-Za-z0-9._-]+', '-', Path(page_rel).stem).strip('-') or 'game'
              digest = hashlib.sha1(page_rel.encode()).hexdigest()[:8]
              dest = out_dir / f'{safe_stem}-{digest}.png'
              try:
                  with Image.open(src) as im:
                      im = im.convert('RGBA')
                      im = ImageOps.fit(im, (180, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                      im.save(dest, 'PNG', optimize=True)
                  return RAW_BASE + dest.as_posix()
              except Exception as e:
                  print(f'WARN icon conversion failed for {icon_rel}: {e}')
                  return None

          patched = 0
          catalog_icons = 0
          fallback_icons = 0
          for page in sorted(targets):
              page_rel = page.as_posix()
              text = page.read_text(encoding='utf-8', errors='replace')
              entry = mapping.get(page_rel)
              if entry:
                  title, icon_rel = entry
                  touch_url = make_png(icon_rel, page_rel)
                  if touch_url:
                      catalog_icons += 1
                  else:
                      touch_url = existing_icon_url(text, page_rel)
                      fallback_icons += 1
              else:
                  tm = re.search(r'<title\b[^>]*>(.*?)</title\s*>', text, re.I | re.S)
                  title = html.unescape(re.sub(r'<[^>]+>', '', tm.group(1)).strip()) if tm else page.stem.replace('-', ' ').replace('_', ' ').title()
                  touch_url = existing_icon_url(text, page_rel)
                  fallback_icons += 1

              text = clean_conflicts(text)
              safe_title = html.escape(title or page.stem, quote=True)
              safe_icon = html.escape(touch_url, quote=True)
              block = (
                  '<!-- GGR_HOME_ICON_START -->\n'
                  f'<link rel="apple-touch-icon" sizes="180x180" href="{safe_icon}">\n'
                  f'<meta name="mobile-web-app-capable" content="yes">\n'
                  f'<meta name="apple-mobile-web-app-capable" content="yes">\n'
                  f'<meta name="apple-mobile-web-app-title" content="{safe_title}">\n'
                  f'<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
                  '<!-- GGR_HOME_ICON_END -->'
              )

              # Prefer the end of a real head so our metadata wins over bundled game metadata.
              mh = list(re.finditer(r'</head\s*>', text, re.I))
              if mh:
                  pos = mh[-1].start()
                  text = text[:pos] + '\n' + block + '\n' + text[pos:]
              else:
                  oh = re.search(r'<head\b[^>]*>', text, re.I)
                  if oh:
                      pos = oh.end()
                      text = text[:pos] + '\n' + block + text[pos:]
                  else:
                      html_tag = re.search(r'<html\b[^>]*>', text, re.I)
                      if html_tag:
                          pos = html_tag.end()
                          text = text[:pos] + '\n<head>\n' + block + '\n</head>\n' + text[pos:]
                      else:
                          text = '<head>\n' + block + '\n</head>\n' + text

              page.write_text(text, encoding='utf-8')
              patched += 1

          print(f'Patched {patched} local HTML game pages')
          print(f'Catalog artwork PNG icons: {catalog_icons}')
          print(f'Existing/generic favicon fallbacks: {fallback_icons}')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/ggr-every-game-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Home Screen icons for every local game"
          git push
