name: GGR Home Screen icon migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ggr-home-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add per-game Home Screen icons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          # --- GGR main page: preserve the selected game's cover/icon in new-tab mode ---
          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          if 'name="apple-mobile-web-app-title"' not in text:
              needle = '<meta name="apple-mobile-web-app-status-bar-style" content="black">'
              if needle not in text:
                  raise SystemExit("Could not find GGR iOS meta block")
              text = text.replace(
                  needle,
                  needle + '\n<meta name="apple-mobile-web-app-title" content="GGR">',
                  1,
              )

          old_sig = 'function launch(path, title = "", opensDirectly = false) {'
          helper = '''function newTabGameUrl(path, title = "") {
              var rows = (typeof catalog !== "undefined" && Array.isArray(catalog))
                  ? catalog
                  : (Array.isArray(window.GAME_DATA) ? window.GAME_DATA : []);
              var row = rows.find(function (g) { return g && g[1] === path; })
                  || rows.find(function (g) { return g && g[3] === title; });
              var icon = (row && row[2]) ? row[2] : "icons/app-192.png";
              var params = new URLSearchParams();
              params.set("game", path);
              params.set("title", title || "Game");
              params.set("icon", icon);
              return "launch.html?" + params.toString();
          }

          function launch(path, title = "", opensDirectly = false) {'''
          if 'function newTabGameUrl(' not in text:
              if old_sig not in text:
                  raise SystemExit("Could not find launch()")
              text = text.replace(old_sig, helper, 1)

          old_open = '''    if (opensDirectly || (window.__ggSettings && window.__ggSettings.launchMode === "newtab")) {
                  window.open(path, "_blank", "noopener");
                  return;
              }'''
          new_open = '''    if (opensDirectly || (window.__ggSettings && window.__ggSettings.launchMode === "newtab")) {
                  window.open(newTabGameUrl(path, title), "_blank", "noopener");
                  return;
              }'''
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif 'window.open(newTabGameUrl(path, title)' not in text:
              raise SystemExit("Could not find new-tab launch block")

          index.write_text(text, encoding="utf-8")

          # --- Full-screen top-level page used by new-tab launches. Keeping this page as
          # the top document lets iOS read a per-game apple-touch-icon when Add to Home Screen is used. ---
          Path("launch.html").write_text(r'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
            <meta name="mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <meta name="theme-color" content="#000000">
            <title>Game</title>
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
              #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
              #missing{display:none;box-sizing:border-box;min-height:100%;padding:32px;color:#fff;background:#0e0e0e;font:16px system-ui,-apple-system,sans-serif;align-items:center;justify-content:center;text-align:center}
            </style>
          </head>
          <body>
            <iframe id="game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
            <div id="missing">This game link is missing.</div>
            <script>
            (function () {
              var q = new URLSearchParams(location.search);
              var game = q.get("game") || "";
              var title = q.get("title") || "Game";
              var icon = q.get("icon") || "icons/app-192.png";
              document.title = title;

              var appTitle = document.createElement("meta");
              appTitle.name = "apple-mobile-web-app-title";
              appTitle.content = title;
              document.head.appendChild(appTitle);

              var iconUrl;
              try { iconUrl = new URL(icon, location.href).href; }
              catch (e) { iconUrl = new URL("icons/app-192.png", location.href).href; }

              var fav = document.createElement("link");
              fav.rel = "icon";
              fav.href = iconUrl;
              document.head.appendChild(fav);

              var touch = document.createElement("link");
              touch.rel = "apple-touch-icon";
              touch.href = iconUrl;
              document.head.appendChild(touch);

              if (!game) {
                document.getElementById("game").remove();
                document.getElementById("missing").style.display = "flex";
                return;
              }

              try { document.getElementById("game").src = new URL(game, location.href).href; }
              catch (e) { document.getElementById("game").src = game; }
            })();
            </script>
          </body>
          </html>
          ''', encoding="utf-8")

          # --- Clever: correct relative favicon + native iOS Home Screen metadata ---
          clever = Path("clever/index.html")
          c = clever.read_text(encoding="utf-8")
          anchor = '    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />'
          block = '''    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
              <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
              <link rel="manifest" href="./manifest.webmanifest" />
              <meta name="theme-color" content="#436cf2" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-title" content="Clever" />
              <meta name="apple-mobile-web-app-status-bar-style" content="default" />'''
          if 'href="./apple-touch-icon.png"' not in c:
              if anchor not in c:
                  raise SystemExit("Could not find Clever favicon line")
              c = c.replace(anchor, block, 1)
          clever.write_text(c, encoding="utf-8")

          Path("clever/manifest.webmanifest").write_text('''{
            "name": "Clever",
            "short_name": "Clever",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#436cf2",
            "icons": [
              { "src": "./favicon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any" }
            ]
          }
          ''', encoding="utf-8")

          # 180x180 PNG rendered from the existing Clever favicon.svg for iOS.
          clever_png_b64 = ""
          Path("clever/apple-touch-icon.png").write_bytes(base64.b64decode(clever_png_b64))
          PY

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/ggr-home-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add per-game Home Screen icons"
          git push origin HEAD:main
