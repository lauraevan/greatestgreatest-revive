name: Direct game Home Screen icons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/direct-game-home-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image support
        run: python3 -m pip install --quiet pillow

      - name: Add native iOS icons to direct library pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import html, json, re

          ROOT = "https://raw.githack.com/lauraevan/greatestgreatest-revive/main/"
          data = Path("games-data.js").read_text(encoding="utf-8")

          # Catalog rows are [source, launch path, icon path, display name, ...].
          row_re = re.compile(
              r'\[\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"\s*,\s*"((?:[^"\\]|\\.)*)"'
          )

          def unquote(s):
              return json.loads('"' + s + '"')

          rows = []
          for m in row_re.finditer(data):
              source, path, icon, title = map(unquote, m.groups())
              if path.startswith("library/") and path.lower().endswith((".html", ".htm")) and icon:
                  rows.append((path, icon, title))

          outdir = Path("home-icons")
          outdir.mkdir(exist_ok=True)
          updated = 0
          generated = 0
          skipped = []

          for page_path, icon_path, title in rows:
              page = Path(page_path)
              src = Path(icon_path)
              if not page.exists() or not src.exists():
                  skipped.append((page_path, icon_path, "missing page/icon"))
                  continue

              # One deterministic PNG per game page. This avoids iOS rejecting/ignoring
              # WEBP/JPG/GIF artwork as an Apple touch icon.
              slug = re.sub(r'[^A-Za-z0-9._-]+', '-', page.stem).strip('-') or 'game'
              png_rel = f"home-icons/{slug}.png"
              png_path = Path(png_rel)
              try:
                  with Image.open(src) as im:
                      im = im.convert("RGBA")
                      canvas = Image.new("RGBA", im.size, (0, 0, 0, 255))
                      canvas.alpha_composite(im)
                      rgb = canvas.convert("RGB")
                      rgb = ImageOps.fit(rgb, (180, 180), method=Image.Resampling.LANCZOS)
                      rgb.save(png_path, "PNG", optimize=True)
                  generated += 1
              except Exception as exc:
                  skipped.append((page_path, icon_path, f"image conversion failed: {exc}"))
                  continue

              text = page.read_text(encoding="utf-8", errors="replace")
              safe_title = html.escape(title, quote=True)
              icon_url = ROOT + png_rel
              block = (
                  '<!-- GGR_HOME_ICON_START -->\n'
                  f'<link rel="apple-touch-icon" sizes="180x180" href="{icon_url}">\n'
                  f'<link rel="icon" type="image/png" sizes="180x180" href="{icon_url}">\n'
                  '<meta name="mobile-web-app-capable" content="yes">\n'
                  '<meta name="apple-mobile-web-app-capable" content="yes">\n'
                  f'<meta name="apple-mobile-web-app-title" content="{safe_title}">\n'
                  '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n'
                  '<!-- GGR_HOME_ICON_END -->'
              )

              marker_re = re.compile(r'<!-- GGR_HOME_ICON_START -->.*?<!-- GGR_HOME_ICON_END -->', re.S)
              if marker_re.search(text):
                  new_text = marker_re.sub(block, text, count=1)
              else:
                  # Put metadata immediately after <head>, BEFORE any <base> tag.
                  new_text, n = re.subn(r'(<head\b[^>]*>)', r'\1\n' + block, text, count=1, flags=re.I)
                  if not n:
                      skipped.append((page_path, icon_path, "no <head>"))
                      try: png_path.unlink()
                      except FileNotFoundError: pass
                      continue

              if new_text != text:
                  page.write_text(new_text, encoding="utf-8")
                  updated += 1

          print(f"Updated {updated} direct game pages; generated {generated} 180x180 icons.")
          if skipped:
              print(f"Skipped {len(skipped)} entries:")
              for x in skipped[:50]: print(" -", x)
          PY

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/direct-game-home-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Home Screen icons to direct game pages"
          git push origin HEAD:main
