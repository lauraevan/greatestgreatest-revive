<style>
:root {
    --bg:#0e0e0e; --panel:#1b1b1b; --panel2:#262626; --panel3:#333333;
    --text:#ffffff; --muted:rgba(255,255,255,.6); --accent:#5986da; --card-min:160px;
}
html[data-theme="arctic"]{ --bg:#0c141d; --panel:#152230; --panel2:#1f3040; --panel3:#294056; --text:#eaf6ff; --muted:rgba(234,246,255,.6); --accent:#56b6e0; }
html[data-theme="blossom"]{ --bg:#1b1013; --panel:#2a181e; --panel2:#3a222b; --panel3:#4a2c38; --text:#ffeef4; --muted:rgba(255,238,244,.6); --accent:#ff7eb0; }
html[data-theme="monochrome"]{ --bg:#121212; --panel:#1e1e1e; --panel2:#2a2a2a; --panel3:#363636; --text:#f0f0f0; --muted:rgba(240,240,240,.6); --accent:#9e9e9e; }
html[data-theme="blood"]{ --bg:#150909; --panel:#251010; --panel2:#351717; --panel3:#471f1f; --text:#ffe6e6; --muted:rgba(255,230,230,.6); --accent:#d63030; }
html[data-theme="sunset"]{ --bg:#191221; --panel:#281b2e; --panel2:#38263f; --panel3:#4a3252; --text:#ffeede; --muted:rgba(255,238,222,.6); --accent:#ff8a5b; }
html[data-theme="beach"]{ --bg:#0b1a1a; --panel:#152a2a; --panel2:#1f3b3b; --panel3:#2a4e4e; --text:#eafcff; --muted:rgba(234,252,255,.6); --accent:#25b0a0; }
html[data-theme="autumn"]{ --bg:#16100a; --panel:#261b11; --panel2:#372718; --panel3:#4a3520; --text:#fdeede; --muted:rgba(253,238,222,.6); --accent:#e08a3c; }
html[data-theme="midnight"]{ --bg:#0a0f1e; --panel:#141b30; --panel2:#1e2842; --panel3:#293556; --text:#e6ecff; --muted:rgba(230,236,255,.6); --accent:#6c8cff; }
html[data-theme="forest"]{ --bg:#0b160e; --panel:#152417; --panel2:#1f3423; --panel3:#2a4630; --text:#e9f7ec; --muted:rgba(233,247,236,.6); --accent:#4caf6a; }
html[data-theme="grape"]{ --bg:#130e1c; --panel:#211830; --panel2:#2f2242; --panel3:#3e2e56; --text:#f2eaff; --muted:rgba(242,234,255,.6); --accent:#a06cff; }
html[data-theme="ocean"]{ --bg:#08161c; --panel:#10242e; --panel2:#183440; --panel3:#214654; --text:#e5f7ff; --muted:rgba(229,247,255,.6); --accent:#3bb6d6; }
html[data-theme="cyber"]{ --bg:#0a0a12; --panel:#141426; --panel2:#1e1e3a; --panel3:#2a2a52; --text:#eafff9; --muted:rgba(234,255,249,.6); --accent:#ff3df0; }
html[data-theme="coffee"]{ --bg:#161009; --panel:#251c11; --panel2:#352817; --panel3:#463620; --text:#f7ecdd; --muted:rgba(247,236,221,.6); --accent:#c98b4b; }
html[data-theme="mint"]{ --bg:#0b1613; --panel:#152420; --panel2:#1f342d; --panel3:#2a463c; --text:#e9fff6; --muted:rgba(233,255,246,.6); --accent:#3ed6a5; }
html[data-theme="rose"]{ --bg:#1a0e12; --panel:#2a1820; --panel2:#3a222d; --panel3:#4c2d3b; --text:#ffecf1; --muted:rgba(255,236,241,.6); --accent:#ff5c8a; }
html[data-theme="lavender"]{ --bg:#12121c; --panel:#1e1e30; --panel2:#2a2a44; --panel3:#383858; --text:#efeaff; --muted:rgba(239,234,255,.6); --accent:#b7a6ff; }
html[data-theme="gold"]{ --bg:#161206; --panel:#26200d; --panel2:#372e13; --panel3:#4a3e1b; --text:#fdf6e3; --muted:rgba(253,246,227,.6); --accent:#e0b83c; }

body { background:var(--bg); color:var(--text); font-family:Arial, sans-serif; margin:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; }
h1 { margin:0; }
#search { background:var(--panel); border:none; color:var(--text); padding:8px 12px; border-radius:8px; outline:none; width:220px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--card-min),1fr)); gap:20px; padding:20px; }
.game { background:var(--panel); border-radius:12px; padding:12px; text-align:center; cursor:pointer; content-visibility:auto; contain-intrinsic-size:auto 200px; box-shadow:0 0 0 0 transparent; transition:box-shadow .15s ease, background .15s ease; }
.game:hover { background:var(--panel2); box-shadow:0 0 0 2px var(--accent); }
.game img { width:100%; height:120px; object-fit:cover; border-radius:8px; }

/* ---- in-site game player ---- */
#player { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:1000; }
#player.open { display:flex; }
#playerBar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 14px; background:var(--panel); }
#playerTitle { font-size:15px; font-weight:bold; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#playerBar .btns { display:flex; gap:8px; flex-shrink:0; }
#playerBar button { background:var(--panel2); border:none; color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
#playerBar button:hover { background:var(--panel3); }
#playerFrame { border:0; flex:1; width:100%; background:#000; }

/* ---- header controls: filter + settings ---- */
.controls { display:flex; align-items:center; gap:10px; position:relative; }
#filterWrap { position:relative; }
#filterBtn, #settingsBtn {
    background:var(--panel); border:none; border-radius:8px; cursor:pointer;
    width:42px; height:38px; padding:0;
    display:flex; align-items:center; justify-content:center; color:var(--text);
}
#filterBtn { flex-direction:column; gap:4px; }
#filterBtn:hover, #settingsBtn:hover { background:var(--panel2); }
#filterBtn span { display:block; width:20px; height:2px; background:var(--text); border-radius:2px; }
#settingsBtn { font-size:20px; line-height:1; }
#filterPanel {
    display:none; position:absolute; right:0; top:46px; z-index:1100;
    background:var(--panel); border-radius:10px; padding:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); min-width:230px; max-height:70vh; overflow:auto;
}
#filterWrap.open #filterPanel { display:block; }
.fp-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; font-weight:bold; }
.fp-head button { background:var(--panel2); border:none; color:var(--text); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
.fp-head button:hover { background:var(--panel3); }
#filterList label { display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:6px; cursor:pointer; }
#filterList label:hover { background:var(--panel2); }
#filterList input { width:16px; height:16px; accent-color:var(--accent); }

/* ---- settings modal ---- */
#settingsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1500; align-items:center; justify-content:center; padding:20px; }
#settingsModal.open { display:flex; }
#settingsCard { background:var(--panel); color:var(--text); border-radius:14px; width:min(560px,100%); max-height:85vh; overflow:auto; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.6); }
.s-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.s-head h2 { margin:0; font-size:22px; }
#settingsClose { background:var(--panel2); border:none; color:var(--text); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; }
#settingsClose:hover { background:var(--panel3); }
.s-section { margin:18px 0; }
.s-section h3 { margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
#themeGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
.theme-opt { display:flex; align-items:center; gap:10px; background:var(--panel2); border:2px solid transparent; color:var(--text); padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; text-align:left; }
.theme-opt:hover { background:var(--panel3); }
.theme-opt.active { border-color:var(--accent); }
.theme-opt .sw { width:18px; height:18px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,.25); }
.s-row { display:flex; gap:10px; flex-wrap:wrap; }
.opt-btn { background:var(--panel2); border:2px solid transparent; color:var(--text); padding:10px 16px; border-radius:10px; cursor:pointer; font-size:14px; }
.opt-btn:hover { background:var(--panel3); }
.opt-btn.active { border-color:var(--accent); }
#cloakTitle { width:100%; box-sizing:border-box; margin-top:10px; background:var(--panel2); border:none; color:var(--text); padding:10px 12px; border-radius:8px; outline:none; }
.s-input { background:var(--panel2); border:none; color:var(--text); padding:10px 12px; border-radius:8px; outline:none; box-sizing:border-box; }
.s-tabs { display:flex; gap:2px; margin:14px 0 6px; border-bottom:1px solid var(--panel2); }
.s-tab { background:transparent; border:none; color:var(--muted); padding:10px 16px; cursor:pointer; font-size:14px; font-weight:bold; border-bottom:2px solid transparent; margin-bottom:-1px; }
.s-tab:hover { color:var(--text); }
.s-tab.active { color:var(--text); border-bottom-color:var(--accent); }
.s-pane[hidden] { display:none; }
.s-stats div { display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--panel2); font-size:15px; }
.s-stats div:last-child { border-bottom:none; }
.s-stats .k { color:var(--muted); }
.s-stats span:last-child { font-weight:bold; }

/* ---- first-load loading screen ---- */
#loader { position:fixed; inset:0; background:var(--bg); z-index:2000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .45s ease; }
#loader.hidden { opacity:0; pointer-events:none; }
#loader .spin { width:54px; height:54px; border:5px solid var(--panel2); border-top-color:var(--accent);
    border-radius:50%; animation:spin .9s linear infinite; }
#loader .lt { color:var(--text); font-family:Arial, sans-serif; font-size:16px; letter-spacing:.5px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ---- site effects ---- */
#fx { position:fixed; inset:0; z-index:500; pointer-events:none; }
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div id="loader"><div class="spin"></div><div class="lt">Loading games…</div></div>

<header>
    <h1>Greatest Greatest Unblocked - Home</h1>
    <div class="controls">
        <input id="search" type="text" placeholder="Search games...">
        <div id="filterWrap">
            <button id="filterBtn" type="button" aria-label="Filter by source" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div id="filterPanel">
                <div class="fp-head">
                    <span>Filter by source</span>
                    <button id="filterAll" type="button">Clear all</button>
                </div>
                <div id="filterList"></div>
            </div>
        </div>
        <button id="settingsBtn" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
</header>

<div class="grid" id="gameGrid"></div>

<div id="settingsModal">
    <div id="settingsCard">
        <div class="s-head"><h2>Settings</h2><button id="settingsClose" aria-label="Close">✕</button></div>
        <div class="s-tabs">
            <button class="s-tab active" data-tab="appearance">Appearance</button>
            <button class="s-tab" data-tab="stealth">Stealth</button>
            <button class="s-tab" data-tab="misc">Misc</button>
        </div>
        <div class="s-pane" data-pane="appearance">
            <div class="s-section">
                <h3>Theme</h3>
                <div id="themeGrid"></div>
            </div>
            <div class="s-section">
                <h3>Card size</h3>
                <div class="s-row">
                    <button class="size-opt opt-btn" data-size="130px">Small</button>
                    <button class="size-opt opt-btn" data-size="160px">Medium</button>
                    <button class="size-opt opt-btn" data-size="200px">Large</button>
                </div>
            </div>
            <div class="s-section">
                <h3>Site effect</h3>
                <div class="s-row">
                    <button class="fx-opt opt-btn" data-fx="none">None</button>
                    <button class="fx-opt opt-btn" data-fx="snow">Snow</button>
                    <button class="fx-opt opt-btn" data-fx="rain">Rain</button>
                    <button class="fx-opt opt-btn" data-fx="petals">Petals</button>
                    <button class="fx-opt opt-btn" data-fx="stars">Stars</button>
                    <button class="fx-opt opt-btn" data-fx="bubbles">Bubbles</button>
                </div>
            </div>
            <div class="s-section">
                <h3>Auto fullscreen</h3>
                <div class="s-row">
                    <button class="fs-opt opt-btn" data-fs="off">Off</button>
                    <button class="fs-opt opt-btn" data-fs="on">On</button>
                </div>
            </div>
        </div>
        <div class="s-pane" data-pane="stealth" hidden>
            <div class="s-section">
                <h3>Game launch</h3>
                <div class="s-row">
                    <button class="launch-opt opt-btn" data-mode="iframe">In the site</button>
                    <button class="launch-opt opt-btn" data-mode="newtab">New tab</button>
                </div>
            </div>
            <div class="s-section">
                <h3>Tab cloak</h3>
                <div class="s-row cloak-presets">
                    <button class="cloak-preset opt-btn" data-i="0">Default</button>
                    <button class="cloak-preset opt-btn" data-i="1">Google</button>
                    <button class="cloak-preset opt-btn" data-i="2">Classroom</button>
                    <button class="cloak-preset opt-btn" data-i="3">Docs</button>
                    <button class="cloak-preset opt-btn" data-i="4">Drive</button>
                </div>
                <input id="cloakTitle" type="text" placeholder="Custom tab title">
            </div>
            <div class="s-section">
                <h3>Panic key</h3>
                <p style="color:var(--muted);font-size:12px;margin:0 0 8px;">Press this key any time to jump to a safe site.</p>
                <div class="s-row">
                    <input id="panicKey" class="s-input" type="text" maxlength="1" placeholder="Key" style="width:80px;flex:none;">
                    <input id="panicUrl" class="s-input" type="text" placeholder="https://classroom.google.com" style="flex:1;min-width:180px;">
                </div>
            </div>
        </div>
        <div class="s-pane" data-pane="misc" hidden>
            <div class="s-section">
                <h3>System details</h3>
                <div class="s-stats">
                    <div><span class="k">Runtime</span><span id="statRuntime">0s</span></div>
                    <div><span class="k">Games</span><span id="statGames">—</span></div>
                    <div><span class="k">Site visitors</span><span id="statVisitors">…</span></div>
                    <div><span class="k">Your visits</span><span id="statMyVisits">—</span></div>
                </div>
            </div>
            <div class="s-section">
                <h3>Reset</h3>
                <button id="settingsReset" class="opt-btn">Reset all settings</button>
            </div>
        </div>
    </div>
</div>

<div id="player">
    <div id="playerBar">
        <span id="playerTitle"></span>
        <span class="btns">
            <button onclick="fullscreenGame()">⛶ Fullscreen</button>
            <button onclick="openGameTab()">↗ New Tab</button>
            <button onclick="closeGame()">✕ Close</button>
        </span>
    </div>
    <iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

/* ---- loading screen: hide as soon as the first cards paint ---- */
function hideLoader() {
    const l = document.getElementById("loader");
    if (l && !l.classList.contains("hidden")) {
        l.classList.add("hidden");
        setTimeout(() => l.remove(), 600);
    }
}
window.addEventListener("load", hideLoader);
setTimeout(hideLoader, 4000);

/* ---- chunked, non-blocking render (never freezes the main thread) ---- */
let renderi = 0, firstPaint = false;
function renderChunk() {
    const start = performance.now();
    const frag = document.createDocumentFragment();
    while (renderi < GAMES.length && (performance.now() - start) < 6) {
        const g = GAMES[renderi];
        const d = document.createElement("div");
        d.className = "game";
        d.dataset.i = renderi;
        if (!visible(renderi)) d.style.display = "none";
        const im = document.createElement("img");
        im.loading = "lazy"; im.decoding = "async"; im.src = g[1];
        d.appendChild(im);
        d.appendChild(document.createTextNode(g[0]));
        frag.appendChild(d);
        cardEls[renderi] = d;
        renderi++;
    }
    grid.appendChild(frag);
    if (!firstPaint) { firstPaint = true; hideLoader(); }
    if (renderi < GAMES.length) requestAnimationFrame(renderChunk);
}
requestAnimationFrame(renderChunk);

/* ---- GAME LAUNCHER (plays in an iframe on the site) ---- */
let currentGamePath = null;
const player = document.getElementById("player");
const playerFrame = document.getElementById("playerFrame");
const playerTitle = document.getElementById("playerTitle");

function launch(path, name) {
    if (window.__ggSettings && window.__ggSettings.launchMode === "newtab") { window.open(path, "_blank", "noopener"); return; }
    currentGamePath = path;
    playerTitle.textContent = name || "";
    playerFrame.src = path;
    player.classList.add("open");
    document.body.style.overflow = "hidden";
    if (window.__ggSettings && window.__ggSettings.autoFullscreen) fullscreenGame();
}

grid.addEventListener("click", e => {
    const card = e.target.closest(".game");
    if (!card) return;
    const g = GAMES[+card.dataset.i];
    if (!g) return;
    if (g[4] === 1) { window.open(g[2], "_blank", "noopener"); return; }
    launch(g[2], g[0]);
});

function closeGame() {
    player.classList.remove("open");
    playerFrame.src = "about:blank";
    document.body.style.overflow = "";
    currentGamePath = null;
}
function fullscreenGame() {
    (playerFrame.requestFullscreen || playerFrame.webkitRequestFullscreen || (() => {})).call(playerFrame);
}
function openGameTab() {
    if (currentGamePath) window.open(currentGamePath, "_blank");
}
document.addEventListener("keydown", e => {
    if (e.key === "Escape" && player.classList.contains("open")) closeGame();
});

    }
    function fxInit(t){
        fxType = t; fxP = [];
        if (t === "none") { if (fxRAF) { cancelAnimationFrame(fxRAF); fxRAF = null; } fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); return; }
        const n = t === "stars" ? 120 : t === "rain" ? 150 : 95;
        for (let i = 0; i < n; i++) fxP.push(fxMake(t));
        if (!fxRAF) fxLoop();
    }
    function fxLoop(){
        const W = fxCanvas.width, H = fxCanvas.height, t = fxType;
        fxCtx.clearRect(0, 0, W, H);
        for (const p of fxP) {
            if (t === "snow") { p.ph += .02; p.x += Math.sin(p.ph)*p.sw; p.y += p.vy; if (p.y > H) { p.y = -5; p.x = rnd(0,W); } fxCtx.fillStyle = "rgba(255,255,255,.85)"; fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.r,0,6.28); fxCtx.fill(); }
            else if (t === "rain") { p.y += p.vy; p.x += 1.5; if (p.y > H) { p.y = -p.len; p.x = rnd(0,W); } fxCtx.strokeStyle = "rgba(140,190,255,.6)"; fxCtx.lineWidth = 1.4; fxCtx.beginPath(); fxCtx.moveTo(p.x,p.y); fxCtx.lineTo(p.x-2,p.y+p.len); fxCtx.stroke(); }
            else if (t === "petals") { p.ph += .03; p.rot += p.vr; p.x += Math.sin(p.ph)*p.sw; p.y += p.vy; if (p.y > H) { p.y = -5; p.x = rnd(0,W); } fxCtx.save(); fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot); fxCtx.fillStyle = "rgba(255,170,205,.85)"; fxCtx.beginPath(); fxCtx.ellipse(0,0,p.r,p.r*.55,0,0,6.28); fxCtx.fill(); fxCtx.restore(); }
            else if (t === "stars") { p.ph += p.tw; const a = .35 + Math.abs(Math.sin(p.ph))*.65; fxCtx.fillStyle = "rgba(255,255,240," + a + ")"; fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.r,0,6.28); fxCtx.fill(); }
            else { p.ph += .02; p.x += Math.sin(p.ph)*p.sw; p.y -= p.vy; if (p.y < -12) { p.y = H+12; p.x = rnd(0,W); } fxCtx.strokeStyle = "rgba(255,255,255,.5)"; fxCtx.lineWidth = 1.2; fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.r,0,6.28); fxCtx.stroke(); }
        }
        fxRAF = requestAnimationFrame(fxLoop);
    }
    function applyEffect(){ fxInit(s.effect || "none"); }
    applyTheme(); applyCloak(); applyCardSize(); applyEffect();
    document.addEventListener("keydown", function(e){ if(!s.panicKey||!s.panicUrl) return; var t=e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return; if(e.key===s.panicKey){ window.location.href = s.panicUrl; } });

    const tg = document.getElementById("themeGrid");
    tg.innerHTML = THEMES.map(t => '<button class="theme-opt" data-theme-id="' + t[0] + '"><span class="sw" style="background:' + t[2] + '"></span>' + t[1] + '</button>').join("");
    function refresh() {
        document.querySelectorAll(".theme-opt").forEach(b => b.classList.toggle("active", b.dataset.themeId === s.theme));
        document.querySelectorAll(".launch-opt").forEach(b => b.classList.toggle("active", b.dataset.mode === s.launchMode));
        document.querySelectorAll(".size-opt").forEach(b => b.classList.toggle("active", b.dataset.size === s.cardSize));
        document.querySelectorAll(".fs-opt").forEach(b => b.classList.toggle("active", b.dataset.fs === (s.autoFullscreen ? "on" : "off")));
        document.getElementById("cloakTitle").value = s.tabTitle || "";
        document.getElementById("panicKey").value = s.panicKey || "";
        document.getElementById("panicUrl").value = s.panicUrl || "";
        document.querySelectorAll(".fx-opt").forEach(b => b.classList.toggle("active", b.dataset.fx === (s.effect || "none")));
    }
    tg.addEventListener("click", e => { const b = e.target.closest(".theme-opt"); if (!b) return; s.theme = b.dataset.themeId; save(); applyTheme(); refresh(); });
    document.querySelectorAll(".launch-opt").forEach(b => b.addEventListener("click", () => { s.launchMode = b.dataset.mode; save(); refresh(); }));
    document.querySelectorAll(".size-opt").forEach(b => b.addEventListener("click", () => { s.cardSize = b.dataset.size; save(); applyCardSize(); refresh(); }));
    document.querySelectorAll(".fs-opt").forEach(b => b.addEventListener("click", () => { s.autoFullscreen = b.dataset.fs === "on"; save(); refresh(); }));
    document.getElementById("panicKey").addEventListener("input", e => { s.panicKey = e.target.value; save(); });
    document.getElementById("panicUrl").addEventListener("input", e => { s.panicUrl = e.target.value; save(); });
    document.querySelectorAll(".fx-opt").forEach(b => b.addEventListener("click", () => { s.effect = b.dataset.fx; save(); applyEffect(); refresh(); }));
    document.querySelectorAll(".cloak-preset").forEach(b => b.addEventListener("click", () => { const c = CLOAKS[+b.dataset.i]; s.tabTitle = c[1]; s.favicon = c[2]; save(); applyCloak(); refresh(); }));
    document.getElementById("cloakTitle").addEventListener("input", e => { s.tabTitle = e.target.value; save(); applyCloak(); });
    document.getElementById("settingsReset").addEventListener("click", () => { s = Object.assign({}, def); save(); applyTheme(); applyCloak(); applyCardSize(); applyEffect(); refresh(); });

    /* ---- settings tabs ---- */
    document.querySelectorAll(".s-tab").forEach(tab => tab.addEventListener("click", () => {
        document.querySelectorAll(".s-tab").forEach(t => t.classList.toggle("active", t === tab));
        document.querySelectorAll(".s-pane").forEach(pane => { pane.hidden = pane.dataset.pane !== tab.dataset.tab; });
    }));
    /* ---- misc system details ---- */
    document.getElementById("statGames").textContent = GAMES.length.toLocaleString();
    const myVisits = (+(localStorage.getItem("ggu-visits") || 0)) + 1;
    localStorage.setItem("ggu-visits", myVisits);
    document.getElementById("statMyVisits").textContent = myVisits.toLocaleString();
    const t0 = Date.now();
    function fmtDur(ms){ let s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60); s = s%60; return (h ? h+"h " : "") + (h||m ? m+"m " : "") + s+"s"; }
    setInterval(() => { const el = document.getElementById("statRuntime"); if (el) el.textContent = fmtDur(Date.now() - t0); }, 1000);
    (function(){
        const el = document.getElementById("statVisitors");
        const dev = () => { el.textContent = myVisits.toLocaleString() + " (this device)"; };
        fetch("https://api.counterapi.dev/v1/gguunblocked/visits/up")
            .then(r => r.json())
            .then(d => { const n = d.count ?? d.value ?? (d.data && d.data.count); if (typeof n === "number") el.textContent = n.toLocaleString(); else return Promise.reject(); })
            .catch(() => fetch("https://api.countapi.xyz/hit/gguunblocked/visits").then(r => r.json()).then(d => { if (typeof d.value === "number") el.textContent = d.value.toLocaleString(); else return Promise.reject(); }))
            .catch(dev);
    })();

    const modal = document.getElementById("settingsModal");
    document.getElementById("settingsBtn").addEventListener("click", () => { refresh(); modal.classList.add("open"); });
    document.getElementById("settingsClose").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("open"); });
    refresh();
})();

</script>
