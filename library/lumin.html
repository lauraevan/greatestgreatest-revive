<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumin Games</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#0e0e0e; color:#fff; font-family:Arial, sans-serif; }
#lumin { width:100%; height:100%; }
#fallback { display:none; padding:40px; text-align:center; }
#fallback a { color:#79aadb; }
</style>

<!-- GGR_HOME_ICON_START -->
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githack.com/lauraevan/greatestgreatest-revive/main/icons/app-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumin Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- GGR_HOME_ICON_END -->
</head>
<body>
<div id="lumin"></div>
<div id="fallback">
    <h2>Lumin library couldn't load</h2>
    <p>The Lumin game service may be blocked on this network. Try again later or on another connection.</p>
</div>
<script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
<script>
    function showFallback() {
        document.getElementById("lumin").style.display = "none";
        document.getElementById("fallback").style.display = "block";
    }
    if (window.Lumin && typeof Lumin.init === "function") {
        try {
            Lumin.init({ container: "#lumin" });
        } catch (e) {
            showFallback();
        }
        // if nothing rendered after a while, show the fallback
        setTimeout(function () {
            var c = document.getElementById("lumin");
            if (c && c.childElementCount === 0) showFallback();
        }, 8000);
    } else {
        showFallback();
    }
</script>
</body>
</html>
